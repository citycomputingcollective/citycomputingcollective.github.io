name: Site checks

# Keeps the discussion templates and the website's taxonomy in step,
# and makes sure the exporter still runs against the current templates.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/scripts/**"
      - "data/taxonomy.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Templates use the themes in data/taxonomy.json
        run: python .github/scripts/export_discussions.py --check-templates
      - name: Example data parses
        run: python -c "import json; json.load(open('data/examples/discussions.json', encoding='utf-8'))"
