title: "[Collaboration] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Describe a concrete research collaboration. Do not include private contact details or restricted data."
  - type: input
    id: question
    attributes:
      label: Research question
      placeholder: What urban question will the collaboration address?
    validations: {required: true}
  - type: dropdown
    id: stage
    attributes:
      label: Project stage
      options: [Idea, Team forming, Active research, Seeking feedback]
    validations: {required: true}
  - type: input
    id: geography
    attributes:
      label: City or geography
      placeholder: City, region, countries, or global
    validations:
      required: true
  - type: textarea
    id: data_methods
    attributes:
      label: Available data and intended methods
      description: Include access or licensing constraints.
    validations:
      required: true
  - type: textarea
    id: expertise
    attributes:
      label: Expertise needed
      description: Be specific about roles and expected contributions.
    validations:
      required: true
  - type: textarea
    id: commitment
    attributes:
      label: Time, output, and credit expectations
      description: State time commitment, intended output, authorship or credit, and deadline.
    validations:
      required: true
  - type: input
    id: links
    attributes:
      label: Relevant public links
      placeholder: Repository, paper, proposal, or project page
  - type: checkboxes
    id: conduct
    attributes:
      label: Community agreement
      options:
        - label: I will follow the Code of Conduct and will not share private or restricted information.
          required: true
