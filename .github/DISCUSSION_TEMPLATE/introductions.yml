title: "[Introduction] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Welcome to the City Computing Collective. Share only information you are comfortable making public. If you tick the directory box at the end, your name and role, location, themes, and collaboration goals also appear in the People directory on citycomputingcollective.com. Edit or delete this post at any time to change or remove that entry."
  - type: input
    id: role
    attributes:
      label: Name or preferred name and current role
      placeholder: Researcher, student, practitioner, community member, or other role
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: City, region, and time zone
      placeholder: Share only the level of location detail you prefer
    validations:
      required: true
  - type: textarea
    id: interests
    attributes:
      label: Urban questions and research themes
      description: What city problems or systems are you interested in?
    validations:
      required: true
  - type: textarea
    id: methods
    attributes:
      label: Methods, data, and experience
      description: What approaches do you use or want to learn?
    validations:
      required: true
  - type: textarea
    id: collaboration
    attributes:
      label: Collaboration goals
      description: What can you offer, and who would you like to meet?
    validations:
      required: true
  - type: input
    id: links
    attributes:
      label: Optional public links
      placeholder: GitHub, ORCID, Scholar, website, project, or publication
  - type: dropdown
    id: themes
    attributes:
      label: Research themes
      description: "The urban systems you work on. They place your introduction under these themes on citycomputingcollective.com."
      multiple: true
      options:
        - "Mobility & Transportation"
        - "Built Environment & Land Use"
        - "Housing & Urban Economics"
        - "Climate, Energy & Resilience"
        - "Health, Equity & Accessibility"
        - "Urban Sensing & Spatial Data"
        - "Governance & Participation"
        - "Urban AI & Simulation"
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Community agreement
      options:
        - label: I will follow the Code of Conduct and will not share private or restricted information.
          required: true
  - type: checkboxes
    id: directory
    attributes:
      label: People directory
      description: Optional. Leave unticked to keep your introduction out of the directory.
      options:
        - label: List my introduction in the People directory on citycomputingcollective.com.
          required: false
