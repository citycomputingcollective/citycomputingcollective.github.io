title: "[Opportunity] "
labels: []
body:
  - type: dropdown
    id: kind
    attributes:
      label: Opportunity type
      options:
        - Call for papers
        - Grant or funding
        - Challenge or hackathon
        - PhD or MSc
        - Internship
        - Postdoc
        - Faculty
        - Industry
        - Public sector or nonprofit
        - Other
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Official title and organization
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Deadline date
      description: The official deadline as YYYY-MM-DD. The website uses it to sort listings and mark them closed.
      placeholder: "2026-12-01"
    validations:
      required: true
  - type: input
    id: deadline_time
    attributes:
      label: Deadline time and time zone
      placeholder: "23:59 AoE"
    validations:
      required: true
  - type: textarea
    id: eligibility
    attributes:
      label: Eligibility, location, and funding or compensation
    validations:
      required: true
  - type: input
    id: official
    attributes:
      label: Official URL
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Relevance to city computing
    validations:
      required: true
  - type: dropdown
    id: themes
    attributes:
      label: Research themes
      description: "Choose the themes this opportunity is relevant to."
      multiple: true
      options:
        - "Mobility & Transportation"
        - "Built Environment & Land Use"
        - "Housing & Urban Economics"
        - "Climate, Energy & Resilience"
        - "Health, Equity & Accessibility"
        - "Urban Sensing & Spatial Data"
        - "Governance & Participation"
        - "Urban AI & Simulation"
    validations:
      required: true
  - type: checkboxes
    id: accuracy
    attributes:
      label: Accuracy
      options:
        - label: I verified this information against the official source and disclosed any relationship to the opportunity.
          required: true
