title: "[Event] "
labels: []
body:
  - type: input
    id: title
    attributes:
      label: Event title and organizer
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Event date
      description: The date of the event as YYYY-MM-DD, or the first day for a multi-day event. The website uses it to list upcoming events.
      placeholder: "2026-11-20"
    validations:
      required: true
  - type: input
    id: datetime
    attributes:
      label: Time, duration, and time zone
      placeholder: "15:00–16:30 UTC"
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - Online
        - In person
        - Hybrid
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location or access information
      description: Do not post private meeting credentials. Use a registration page.
    validations:
      required: true
  - type: input
    id: registration
    attributes:
      label: Registration or official URL
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Audience, topics, accessibility, capacity, and recording information
    validations:
      required: true
  - type: dropdown
    id: themes
    attributes:
      label: Research themes
      description: "Choose the themes this event covers."
      multiple: true
      options:
        - "Mobility & Transportation"
        - "Built Environment & Land Use"
        - "Housing & Urban Economics"
        - "Climate, Energy & Resilience"
        - "Health, Equity & Accessibility"
        - "Urban Sensing & Spatial Data"
        - "Governance & Participation"
        - "Urban AI & Simulation"
    validations:
      required: true
  - type: checkboxes
    id: accuracy
    attributes:
      label: Community agreement
      options:
        - label: I have permission to share this event and will update the post if details change.
          required: true
