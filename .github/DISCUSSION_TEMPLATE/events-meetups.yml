title: "[Event] "
labels: []
body:
  - type: input
    id: title
    attributes: {label: Event title and organizer}
    validations: {required: true}
  - type: input
    id: datetime
    attributes: {label: Date, time, and time zone}
    validations: {required: true}
  - type: dropdown
    id: format
    attributes: {label: Format, options: [Online, In person, Hybrid]}
    validations: {required: true}
  - type: textarea
    id: location
    attributes: {label: Location or access information, description: Do not post private meeting credentials. Use a registration page.}
    validations: {required: true}
  - type: input
    id: registration
    attributes: {label: Registration or official URL}
    validations: {required: true}
  - type: textarea
    id: description
    attributes: {label: Audience, topics, accessibility, capacity, and recording information}
    validations: {required: true}
  - type: checkboxes
    id: accuracy
    attributes:
      label: Community agreement
      options:
        - label: I have permission to share this event and will update the post if details change.
          required: true
