title: "[Question] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Ask a question about urban data, methods, tools, or research practice. Say what you have already tried or read, so answers can start from there."
  - type: input
    id: question
    attributes:
      label: Your question in one sentence
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and what you have tried
      description: The city or setting, the data or tools involved, and where you are stuck. Do not include private or restricted data.
    validations:
      required: true
  - type: input
    id: geography
    attributes:
      label: City or geography, if relevant
    validations:
      required: false
  - type: dropdown
    id: themes
    attributes:
      label: Research themes
      description: "Choose the themes your question belongs to."
      multiple: true
      options:
        - "Mobility & Transportation"
        - "Built Environment & Land Use"
        - "Housing & Urban Economics"
        - "Climate, Energy & Resilience"
        - "Health, Equity & Accessibility"
        - "Urban Sensing & Spatial Data"
        - "Governance & Participation"
        - "Urban AI & Simulation"
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Community agreement
      options:
        - label: I will follow the Code of Conduct and will mark an answer when one solves my question.
          required: true
